[pytest]
pythonpath = .
testpaths = tests
cache_dir = .pytest_cache
markers =
    windows: needs Windows (DPAPI, cmd.exe, Windows-only setup paths)
    powershell: needs PowerShell (Windows PowerShell on Windows, pwsh elsewhere)
    chromium: needs Playwright Chromium installed
    integration: runs the real launcher and installers; set LCSJIT_INTEGRATION=1 to run
