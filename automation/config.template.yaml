# Paste the complete LCS sandbox environment-details URL (including EnvironmentId).
ENVIRONMENT_URL: ""

# Exact LCS reason determines permissions. Change only to an approved option.
# Read-write AX: "Performance tuning for AX (write to AX)"
# MR: "MR troubleshooting (read-only to MR)"
# AXDW: "Troubleshooting and tuning entity store (write to AXDW)"
ACCESS_REASON: "AX troubleshooting (read-only to AX)"

# Approved justification for the Request access block.
ACCESS_DETAILS: ""

# Temporary firewall rule name. Leave blank to use this computer's own name,
# lcsjit-<8 characters> (shown by .\run.cmd -ValidateOnly), so computers sharing
# an environment never collide. An existing rule is never overwritten.
FIREWALL_RULE_NAME: ""

# Optional: the public IPv4 address your SQL traffic leaves from. Set it only when
# automatic detection is blocked or picks the wrong address (proxy, VPN, split
# tunnel); a SQL login refusal then reports the address Azure SQL saw.
# PUBLIC_IP: ""
