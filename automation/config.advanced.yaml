# Advanced reference profile. Normal users edit ../config.yaml only.
# Copy this file (for example to automation/my-profile.local.yaml), replace the
# example URL and every REPLACE_ value, then run:
#   .\run.cmd -Config "automation/my-profile.local.yaml"
# This copy is rejected until the REPLACE_ values are edited.
# Relative paths resolve from the folder that contains the profile.
LCS_PROJECT_ID: "123456"
# Optional: exact environment name shown as the page heading. Blank = read it
# from the verified environment page.
ENVIRONMENT_ID: ""
ENVIRONMENT_URL: "https://lcs.dynamics.com/V2/EnvironmentDetailsV3New/123456?EnvironmentId=11111111-2222-4333-8444-555555555555"
ACCESS_LEVEL: "read_only"
ACCESS_REASON: "AX troubleshooting (read-only to AX)"
ACCESS_DETAILS: "REPLACE_WITH_APPROVED_JUSTIFICATION"
SQL_SCRIPTS_PATH: "../sql_scripts"
CONTINUE_ON_ERROR: false
DISABLE_ACCESS_AFTER: true # Delete only the uniquely named rule created by this run.
STORAGE_STATE_PATH: "./.auth/advanced_profile_auth.enc"
AUTH_KEY_PATH: "./.auth/advanced_profile_key.dpapi" # Encrypted by Windows DPAPI, same user only.
BROWSER_TIMEZONE: "UTC"
LOGS_PATH: "./logs"
# Optional: the public IPv4 your SQL traffic leaves from (blank = detect).
PUBLIC_IP: ""
SQL_DNS_SUFFIX: "database.windows.net"
# Optional: force a driver. Default: ODBC Driver 18, then 17, whichever is installed.
# SQL_ODBC_DRIVER: "ODBC Driver 17 for SQL Server"
SQL_TIMEOUT_SECONDS: 60
MAX_RESULT_ROWS: 100
selectors:
  environment_link: ""
  maintain: "button[id$='_MaintainEnvironment_button']"
  enable_access: "#NetworkSecurityGroupModify"
  enable_dialog: "[role='dialog']:has([id$='_NetworkSecurityRuleList'])"
  accounts: "[id$='_ManageEnvironmentSection']"
  reason: "#JITOptionDropdownCustomerView_input"
  reason_list: "#JITOptionDropdownCustomerView_list"
  details: "#JITInput_input"
  request_access: "#JITRequestAccessButtonCustomerView"
  rows: "[id$='_SqlAccountTable'] .rowTemplate:not(.place-holder):visible"
  server_database: "input[name='ServerDbName']"
  username: "input[name='SqlUserName']"
  password: "[data-colindex='4'] input[name='SqlPasswordText']"
  password_reveal: "[id='ToggleVisibilityIcon']"
  expires_at: "[data-colindex='5'] input[name='ReasonForAccess']"
  expiry_format: "lcs_utc"
  row_reason: "[data-colindex='6'] input[name='ReasonForAccessDetails']"
  row_details: "[data-colindex='7'] input[name='SqlPasswordText']"
  rule_name: "" # Blank: this computer's lcsjit-<8 hex> name. Existing rules are never overwritten.
  rule_grid: "[id$='_NetworkSecurityRuleList']"
  rule_add: "button[id$='_AddRule']"
  rule_delete: "button[id$='_DeleteRules']"
  rule_close: "button[id$='_CloseButton']"
  rule_add_dialog: "[role='dialog']:has(input[name='IpOrCidrField'])"
  rule_confirm: "button[id$='_CreateTopBtn']"
